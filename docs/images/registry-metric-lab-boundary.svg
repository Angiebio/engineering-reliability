<circle data-series="identity" data-x="9" data-value="500" cx="568.600" cy="270.125" r="3.5" fill="#3f6798"/>
<circle data-series="identity" data-x="10" data-value="500" cx="624.000" cy="270.125" r="3.5" fill="#3f6798"/>
<line x1="360" y1="95" x2="391" y2="95" stroke="#3f6798" stroke-width="4"/>
<text x="402" y="102" fill="#3f6798" font-size="21">Trial identities</text>
</g>
