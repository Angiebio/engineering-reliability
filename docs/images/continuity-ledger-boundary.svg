<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="title desc">
<title id="title">Can more memory make a restart worse?</title>
<desc id="desc">Raw-tail resumptions fall from 12 at 541 bytes to nine at 542, while the timeline remains at 12. More retained bytes need not preserve the evidence the reader needs. Authored histories and a deterministic reader. This measures these retention policies on these fixtures, not memory performance of a live model.</desc>
