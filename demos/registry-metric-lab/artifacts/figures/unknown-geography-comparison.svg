<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="comparison-unknown-geography-title comparison-unknown-geography-desc"><title id="comparison-unknown-geography-title">A trial without known geography | country=all; kind=all | 4 trials; 4 query rows | invented, trial-wide values</title><desc id="comparison-unknown-geography-desc">Bars start at zero on a common scale. Each dot is one observed rate; triangles are medians.</desc><rect width="1000" height="610" fill="#fffdf7"/><g font-family="system-ui,sans-serif" fill="#16382f" font-size="15"><text x="20" y="24" font-size="14">A trial without known geography | country=all; kind=all | 4 trials; 4 query rows | invented, trial-wide values</text><text class="bar-label" data-method="incorrect" x="20" y="96">Joined-row sum</text><rect class="enrollment-bar" data-method="incorrect" x="210" y="78" width="550.0" height="24" fill="#b45e3c"/><text class="bar-value" data-method="incorrect" x="770.0" y="96" font-weight="700">700</text><text class="bar-label" data-method="corrected" x="20" y="160">Trial-identity sum</text><rect class="enrollment-bar" data-method="corrected" x="210" y="142" width="550.0" height="24" fill="#2a7559"/><text class="bar-value" data-method="corrected" x="770.0" y="160" font-weight="700">700</text><g class="rate-lane" data-method="incorrect" data-top="272" data-bottom="288"><text x="20" y="242">DISTINCT rate values</text><line x1="220" y1="288" x2="770" y2="288" stroke="#ccd5cd"/><circle class="rate-observation" cx="372.77777777777777" cy="279" r="7" fill="#b45e3c"/><circle class="rate-observation" cx="678.3333333333333" cy="279" r="7" fill="#b45e3c"/><path class="median-marker" d="M525.5555555555555 290 l-6 11 h12 Z" fill="#b45e3c"/><text class="rate-tick" x="220.0" y="320" text-anchor="middle" font-size="11">0</text><text class="rate-tick" x="372.77777777777777" y="320" text-anchor="middle" font-size="11">10</text><text class="rate-tick" x="678.3333333333333" y="320" text-anchor="middle" font-size="11">30</text><text x="20" y="345" font-size="13">n=2; median 20</text></g><g class="rate-lane" data-method="corrected" data-top="425" data-bottom="459"><text x="20" y="395">One rate per trial</text><line x1="220" y1="459" x2="770" y2="459" stroke="#ccd5cd"/><circle class="rate-observation" cx="372.77777777777777" cy="450" r="7" fill="#2a7559"/><circle class="rate-observation" cx="372.77777777777777" cy="432" r="7" fill="#2a7559"/><circle class="rate-observation" cx="678.3333333333333" cy="450" r="7" fill="#2a7559"/><path class="median-marker" d="M372.77777777777777 461 l-6 11 h12 Z" fill="#2a7559"/><text class="rate-tick" x="220.0" y="491" text-anchor="middle" font-size="11">0</text><text class="rate-tick" x="372.77777777777777" y="491" text-anchor="middle" font-size="11">10</text><text class="rate-tick" x="678.3333333333333" y="491" text-anchor="middle" font-size="11">30</text><text x="20" y="516" font-size="13">n=3; median 10</text></g><text x="20" y="566" font-size="13">Synthetic rate: participants per month, per trial.</text><text x="20" y="585" font-size="13">Unweighted median; middle pair averaged for even n.</text></g></svg>