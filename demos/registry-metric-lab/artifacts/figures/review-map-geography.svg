country="US" data-method="Identity" x="20" y="454" width="510.44776119402985" height="18" fill="#2a7559"/><text x="20" y="489" font-size="13">Identity: 570</text><text x="20" y="527" font-size="14">Trial-wide totals; overlapping countries are not additive.</text></g></svg>