<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 401" role="img" aria-labelledby="geography-multinational-title geography-multinational-desc"><title id="geography-multinational-title">Countries overlap | country=all; kind=all | 3 trials; 2 country groups; map always joins sites | invented, trial-wide values</title><desc id="geography-multinational-desc">TrialCat map joins sites even with no geographic filter. Bars compare joined sums with unique trial-country pairs.</desc><rect width="1000" height="401" fill="#fffdf7"/><g font-family="system-ui,sans-serif" fill="#16382f" font-size="15"><text x="20" y="24" font-size="14">Countries overlap | country=all; kind=all | 3 trials; 2 country groups; map always joins sites | invented,</text><text x="20" y="42" font-size="14">trial-wide values</text><text x="20" y="74" font-weight="700">CA · 1 trial; known n=1</text><rect class="geography-bar" data-country="CA" data-method="Joined" x="20" y="94" width="100.0" height="18" fill="#b45e3c"/><text x="20" y="129" font-size="13">Joined: 100</text><rect class="geography-bar" data-country="CA" data-method="Identity" x="20" y="152" width="100.0" height="18" fill="#2a7559"/><text x="20" y="187" font-size="13">Identity: 100</text><text x="20" y="225" font-weight="700">US · 3 trials; known n=3</text><rect class="geography-bar" data-country="US" data-method="Joined" x="20" y="245" width="600.0" height="18" fill="#b45e3c"/><text x="20" y="280" font-size="13">Joined: 600</text><rect class="geography-bar" data-country="US" data-method="Identity" x="20" y="303" width="500.0" height="18" fill="#2a7559"/><text x="20" y="338" font-size="13">Identity: 500</text><text x="20" y="376" font-size="14">Trial-wide totals; overlapping countries are not additive.</text></g></svg>