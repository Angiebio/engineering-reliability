<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" role="img" aria-labelledby="comparison-all-missing-title comparison-all-missing-desc"><title id="comparison-all-missing-title">Three trials, no known values | country=US; kind=all | 3 trials; 4 query rows | invented, trial-wide values</title><desc id="comparison-all-missing-desc">Bars start at zero on a common scale. Each dot is one observed rate; triangles are medians.</desc><rect width="1000" height="592" fill="#fffdf7"/><g font-family="system-ui,sans-serif" fill="#16382f" font-size="15"><text x="20" y="24" font-size="14">Three trials, no known values | country=US; kind=all | 3 trials; 4 query rows | invented, trial-wide values</text><text class="bar-label" data-method="incorrect" x="20" y="96">Joined-row sum</text><rect class="enrollment-bar" data-method="incorrect" x="210" y="78" width="0" height="24" fill="#b45e3c"/><text class="bar-value" data-method="incorrect" x="220" y="96" font-weight="700">unknown</text><text class="bar-label" data-method="corrected" x="20" y="160">Trial-identity sum</text><rect class="enrollment-bar" data-method="corrected" x="210" y="142" width="0" height="24" fill="#2a7559"/><text class="bar-value" data-method="corrected" x="220" y="160" font-weight="700">unknown</text><g class="rate-lane" data-method="incorrect" data-top="272" data-bottom="288"><text x="20" y="242">DISTINCT rate values</text><line x1="220" y1="288" x2="770" y2="288" stroke="#ccd5cd"/><text class="rate-tick" x="220.0" y="320" text-anchor="middle" font-size="11">0</text><text x="20" y="345" font-size="13">n=0; median unknown</text></g><g class="rate-lane" data-method="corrected" data-top="425" data-bottom="441"><text x="20" y="395">One rate per trial</text><line x1="220" y1="441" x2="770" y2="441" stroke="#ccd5cd"/><text class="rate-tick" x="220.0" y="473" text-anchor="middle" font-size="11">0</text><text x="20" y="498" font-size="13">n=0; median unknown</text></g><text x="20" y="548" font-size="13">Synthetic rate: participants per month, per trial.</text><text x="20" y="567" font-size="13">Unweighted median; middle pair averaged for even n.</text></g></svg>