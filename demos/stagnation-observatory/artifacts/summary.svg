<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="summary-title summary-desc"><title id="summary-title">Policy conformance on authored examples</title><desc id="summary-desc">Expected labels encode the verified-progress policy, so 60/0 is conformance by construction. This monitor also sees artifacts and waits; the baselines see text only. Counts are event-level, not a held-out capability estimate.</desc><rect width="1100" height="440" fill="#f6f4ed"/><text x="42" y="45" font-family="Georgia,serif" font-size="28" fill="#142d3d">Policy conformance on authored examples</text><text x="42" y="76" font-family="sans-serif" font-size="15" fill="#526575">24 development traces · 152 events · no held-out data · no model calls</text><text x="42" y="132" font-family="sans-serif" font-size="16" fill="#142d3d">Exact text</text><rect x="235" y="112" width="381.33" height="18" fill="#217966"/><text x="626.33" y="126" font-family="sans-serif" font-size="14" fill="#142d3d">44 true alerts</text><rect x="235" y="137" width="312.00" height="18" fill="#b65b33"/><text x="557.00" y="151" font-family="sans-serif" font-size="14" fill="#142d3d">36 false alerts</text><text x="42" y="205" font-family="sans-serif" font-size="16" fill="#142d3d">Lexical similarity</text><rect x="235" y="185" width="381.33" height="18" fill="#217966"/><text x="626.33" y="199" font-family="sans-serif" font-size="14" fill="#142d3d">44 true alerts</text><rect x="235" y="210" width="312.00" height="18" fill="#b65b33"/><text x="557.00" y="224" font-family="sans-serif" font-size="14" fill="#142d3d">36 false alerts</text><text x="42" y="278" font-family="sans-serif" font-size="16" fill="#142d3d">Verified progress</text><rect x="235" y="258" width="520.00" height="18" fill="#217966"/><text x="765.00" y="272" font-family="sans-serif" font-size="14" fill="#142d3d">60 true alerts</text><rect x="235" y="283" width="0.00" height="18" fill="#b65b33"/><text x="245.00" y="297" font-family="sans-serif" font-size="14" fill="#142d3d">0 false alerts</text><rect x="26" y="334" width="1048" height="88" fill="#e5ebe5"/><text x="42" y="357" font-family="sans-serif" font-size="15" font-weight="700" fill="#142d3d">Expected labels encode the verified-progress policy, so 60/0 is conformance by construction.</text><text x="42" y="382" font-family="sans-serif" font-size="15" fill="#142d3d">This monitor also sees artifacts and waits; the baselines see text only.</text><text x="42" y="405" font-family="sans-serif" font-size="14" fill="#526575">Useful work with sparse milestones can still alert. See the separate cadence sweep; no generalization claim.</text></svg>